name: SPECTER

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: specter
  cancel-in-progress: false

jobs:
  specter:
    runs-on: ubuntu-latest        # быстрее и дешевле windows-latest; xray скрипт качает сам
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q requests

      - name: Run
        run: python specter.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PYTHONUNBUFFERED: '1'
